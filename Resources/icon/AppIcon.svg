<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="100" y1="100" x2="924" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c2733"/>
      <stop offset="100%" stop-color="#11181f"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="0" y1="400" x2="0" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5f7fa"/>
      <stop offset="100%" stop-color="#d8dce4"/>
    </linearGradient>
    <linearGradient id="accent" x1="262" y1="0" x2="762" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d4b8"/>
      <stop offset="100%" stop-color="#00b89e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="118" y="118" width="788" height="788" rx="170" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="18"/>

  <!-- 選んだ語のハイライト -->
  <rect x="242" y="392" width="540" height="150" rx="22" fill="#2a3747" filter="url(#shadow)"/>
  <text x="512" y="507" text-anchor="middle" font-family="Helvetica Neue" font-weight="800" font-size="150" letter-spacing="-4" fill="url(#wordGrad)">gloss</text>

  <!-- 下線 -->
  <path d="M262 612 L762 612" fill="none" stroke="url(#accent)" stroke-width="42" stroke-linecap="round"/>

  <!-- 余白の注釈の印 -->
  <path d="M808 418 L842 418" fill="none" stroke="#00d4b8" stroke-width="22" stroke-linecap="round"/>
  <path d="M808 458 L830 458" fill="none" stroke="#00d4b8" stroke-width="22" stroke-linecap="round" stroke-opacity="0.6"/>
</svg>
