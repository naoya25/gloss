  .sep{stroke:#d1d9e0}
  .chip{fill:#ffffff;stroke:#d1d9e0}
  .badge{fill:none;stroke:#d1d9e0}
  .badge.sql{stroke:#2f6bff}
  .badget{font-size:10.5px;font-weight:600;fill:#59636e}
  .badget.sql{fill:#2f6bff}
  .rel{fill:none;stroke:#2f6bff;stroke-width:1.5}
  .rel.weak{stroke:#59636e;stroke-dasharray:5 4}
  .mk{fill:none;stroke:#2f6bff;stroke-width:1.5}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}
    text{fill:#e6edf3}
    .s,.badget{fill:#9198a1}
    .key,.badget.sql{fill:#4c8dff}
    .card,.chip{fill:#0d1117;stroke:#3d444d}
    .head{fill:#151b23}
    .head.sql{fill:#4c8dff;fill-opacity:.18}
    .sep,.badge{stroke:#3d444d}
    .badge.sql{stroke:#4c8dff}
    .rel,.mk{stroke:#4c8dff}
    .rel.weak{stroke:#9198a1}
  }
</style>
