<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-label="Gloss は Pages・Stores・GlossCore の3層で、GlossCore が AI と Cloudflare の Worker に話しかけ、手元の JSON と Keychain に保存する">
<style>
  .bg{fill:#ffffff}
  text{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:12px;fill:#1f2328}
  .t{font-size:13px;font-weight:600}
  .s{fill:#59636e}
  .xs{font-size:11px}
  .g{font-size:12px;font-weight:600;fill:#59636e;letter-spacing:.02em}
  .panel{fill:#f6f8fa;stroke:#d1d9e0}
  .card{fill:#ffffff;stroke:#d1d9e0}
  .l1{fill:#2f6bff;fill-opacity:.16;stroke:#2f6bff;stroke-opacity:.35}
  .l2{fill:#2f6bff;fill-opacity:.10;stroke:#2f6bff;stroke-opacity:.28}
  .l3{fill:#2f6bff;fill-opacity:.05;stroke:#2f6bff;stroke-opacity:.22}
  .tag{fill:none;stroke:#d1d9e0}
  .chip{fill:#ffffff;stroke:#d1d9e0}
  .line{fill:none;stroke:#59636e;stroke-width:1.5}
  .acc{stroke:#2f6bff}
  .dash{stroke-dasharray:5 4}
  .life{stroke:#d1d9e0;stroke-width:1.5;stroke-dasharray:4 4}
  .hd{fill:#59636e}
  .hd.acc{fill:#2f6bff}
  .num{fill:#2f6bff}
  .numt{fill:#ffffff;font-size:11px;font-weight:700;text-anchor:middle}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}
    text{fill:#e6edf3}
    .s,.g{fill:#9198a1}
    .panel{fill:#151b23;stroke:#3d444d}
    .card{fill:#0d1117;stroke:#3d444d}
    .l1,.l2,.l3{fill:#4c8dff;stroke:#4c8dff}
    .tag{stroke:#3d444d}
    .chip{fill:#0d1117;stroke:#3d444d}
    .line{stroke:#9198a1}
    .acc{stroke:#4c8dff}
    .life{stroke:#3d444d}
    .hd{fill:#9198a1}
    .hd.acc,.num{fill:#4c8dff}
    .numt{fill:#0d1117}
  }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hd" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="hd acc" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" width="960" height="520"/>
<text x="32" y="40" class="g">Gloss.app(macOS)</text>
<rect class="panel" x="32" y="52" width="480" height="436" rx="14"/>
<rect class="l1" x="56" y="84" width="432" height="72" rx="10"/>
<text x="72" y="112" class="t">Pages</text>
<text x="72" y="132" class="s">Translate · Book · Challenge · Report · History</text>
<rect class="l2" x="56" y="180" width="432" height="72" rx="10"/>
<text x="72" y="208" class="t">Stores</text>
<text x="72" y="228" class="s">@Observable · private(set) の state を1つずつ持つ</text>
<rect class="l3" x="56" y="276" width="432" height="96" rx="10"/>
<text x="72" y="304" class="t">GlossCore</text>
<text x="72" y="324" class="s">Models · Prompts · ChatClient</text>
<text x="72" y="344" class="s">SyncClient · JSONFile · Keychain</text>
<path class="line" d="M352,156 L352,178" marker-end="url(#a)"/>
<text x="362" y="171" class="s xs">メソッドを呼ぶ</text>
<path class="line" d="M300,180 L300,158" marker-end="url(#a)"/>
<text x="290" y="171" class="s xs" text-anchor="end">state を読む</text>
<path class="line" d="M272,252 L272,274" marker-end="url(#a)"/>
<path class="line" d="M160,372 L160,394" marker-end="url(#a)"/>
<path class="line" d="M384,372 L384,394" marker-end="url(#a)"/>
<path class="card" d="M56,404 a104.0,8 0 0 0 208,0 v60 a104.0,8 0 0 1 -208,0 z"/><ellipse class="card" cx="160.0" cy="404" rx="104.0" ry="8"/><text x="72" y="430" class="t">Application Support/Gloss</text><text x="72" y="450" class="s">*.json · images/</text>
<path class="card" d="M280,404 a104.0,8 0 0 0 208,0 v60 a104.0,8 0 0 1 -208,0 z"/><ellipse class="card" cx="384.0" cy="404" rx="104.0" ry="8"/><text x="296" y="430" class="t">Keychain</text><text x="296" y="450" class="s">trapop-* · gloss-sync</text>
<text x="672" y="40" class="g">AI(どれか1つ)</text>
<rect class="panel" x="672" y="52" width="256" height="180" rx="14"/>
<rect class="card" x="696" y="76" width="208" height="34" rx="17"/>
<text x="800" y="98" text-anchor="middle">JAPAN AI Gateway</text>
<rect class="card" x="696" y="124" width="208" height="34" rx="17"/>
<text x="800" y="146" text-anchor="middle">OpenAI</text>
<rect class="card" x="696" y="172" width="208" height="34" rx="17"/>
<text x="800" y="194" text-anchor="middle">Gemini</text>
<text x="672" y="284" class="g">Cloudflare</text>
<rect class="panel" x="672" y="296" width="256" height="192" rx="14"/>
<rect class="card" x="696" y="320" width="208" height="60" rx="10"/>
<text x="712" y="346" class="t">Worker</text>
<text x="712" y="366" class="s">/api/words · /api/activity</text>
<path class="line" d="M800,380 L800,398" marker-end="url(#a)"/>
<path class="card" d="M696,408 a104.0,8 0 0 0 208,0 v56 a104.0,8 0 0 1 -208,0 z"/><ellipse class="card" cx="800.0" cy="408" rx="104.0" ry="8"/><text x="712" y="434" class="t">D1</text><text x="712" y="454" class="s">words · activity</text>
<path class="line acc" d="M488,300 C579.0,300 579.0,142 670,142" marker-end="url(#b)"/>
<rect class="chip" x="513.0" y="199" width="132" height="44" rx="8"/><text x="579" y="218" text-anchor="middle">翻訳・解説・採点</text><text x="579" y="234" class="s xs" text-anchor="middle">SSE で受け取る</text>
<path class="line acc" d="M488,348 C591.0,348 591.0,350 694,350" marker-end="url(#b)"/>
<rect class="chip" x="525.0" y="327" width="132" height="44" rx="8"/><text x="591" y="346" text-anchor="middle">単語帳と記録の同期</text><text x="591" y="362" class="s xs" text-anchor="middle">Bearer トークン</text>
</svg>
